[package]
name = "app"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/bin/app.rs"

[dependencies]
zikaron-ui = { path = "../zikaron-ui" }
zikaron = { path = "../zikaron" }
zikaron-kit = { path = "../zikaron-kit" }
zikaron-store = { path = "../zikaron-store" }
zikaron-anchor = { path = "../zikaron-anchor" }
zikaron-net = { path = "../zikaron-net" }
zikaron-glue = { path = "../zikaron-glue" }
zikaron-os = { path = "../zikaron-os" }
zikaron-seal = { path = "../zikaron-seal" }
zikaron-send = { path = "../zikaron-send" }
eframe = { version = "0.34", default-features = false, features = ["glow"] }
raw-window-handle = "0.6"
bip39 = { version = "2", default-features = false, features = ["alloc"] }
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "wgpu_no_default_features"] }
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "x11", "wayland"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
log = "0.4"
winit = { version = "0.30", default-features = false, features = ["x11"] }
smithay-client-toolkit = { version = "0.19.2", default-features = false }
wayland-client = { version = "0.31", features = ["system"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.17", default-features = false }

[build-dependencies]
zikaron-pack = { path = "../zikaron-pack" }
