[package]
name = "zikaron-store"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Outside the law: zero dependencies, standard library only. Entries are opaque bytes to this crate:
# never parsed, signed or checked against the chain; names come from the caller, and the layout is a
# product constant (in src/layout.rs only).
[dependencies]

# A small helper binary for exercising this crate end to end.
[[bin]]
name = "zks"
path = "src/bin/zks.rs"
