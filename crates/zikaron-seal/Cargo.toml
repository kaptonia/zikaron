[package]
name = "zikaron-seal"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
zikaron = { path = "../zikaron" }
zikaron-kit = { path = "../zikaron-kit" }
zikaron-store = { path = "../zikaron-store" }
zikaron-glue = { path = "../zikaron-glue" }
zikaron-os = { path = "../zikaron-os" }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
scrypt = { version = "0.11", default-features = false }
aes = "0.8"
ctr = "0.9"
