[package]
name = "zikaron-seal"
version = "0.1.3"
edition = "2024"
license = "MIT"

# The sealed layer, one implementation for the desktop and the command line: the envelope every local file is
# sealed in, the names key, the key vault, the sealed ledger, and the plain formats read from sealed files. It
# holds no window and no words for people: refusals are a closed code with evidence, and each end says them.

[dependencies]
# The core's canonical bytes, hex spelling, hashes and entry ids; the kit's document ids; the store's ledger
# directory; the glue's sealed magic, grant file reading and terms room; the platform piece's entropy, owner-only
# files, atomic replacement, kernel locks and wiping. Path dependencies only, none of them a window.
zikaron = { path = "../zikaron" }
zikaron-kit = { path = "../zikaron-kit" }
zikaron-store = { path = "../zikaron-store" }
zikaron-glue = { path = "../zikaron-glue" }
zikaron-os = { path = "../zikaron-os" }
# Third-party cryptography, closed: the authenticated cipher of every sealed file, the key derivations, the
# keystore V3 primitives of the key vault. Only `crypto` touches them.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
scrypt = { version = "0.11", default-features = false }
aes = "0.8"
ctr = "0.9"
