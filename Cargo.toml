# ZIKARON Desk workspace.
# base/ holds the zikaron/1 law texts and their reference implementation; no crate depends on it by path.
[workspace]
resolver = "2"
members = [
  "crates/zikaron",
  "crates/zikaron-kit",
  "crates/zikaron-store",
  "crates/zikaron-net",
  "crates/zikaron-os",
  "crates/zikaron-pack",
  "crates/zikaron-anchor",
  "crates/zikaron-cli",
  "crates/zikaron-glue",
  "crates/zikaron-ui",
  "crates/app",
]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
strip = "symbols"
lto = "thin"
