# ZIKARON Desk workspace.
# base/ holds the zikaron/1 law texts and their reference implementation; no crate depends on it by path.
[workspace]
resolver = "3"
members = [
  "crates/zikaron",
  "crates/zikaron-kit",
  "crates/zikaron-store",
  "crates/zikaron-net",
  "crates/zikaron-os",
  "crates/zikaron-pack",
  "crates/zikaron-anchor",
  "crates/zikaron-cli",
  "crates/zikaron-glue",
  "crates/zikaron-seal",
  "crates/zikaron-send",
  "crates/zikaron-ui",
  "crates/app",
]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.release]
strip = "symbols"
lto = "thin"
# Every build, test and shipped binary is a release build, and a release build checks integer overflow: an
# overflow stops the program by name instead of wrapping into a wrong number.
overflow-checks = true
